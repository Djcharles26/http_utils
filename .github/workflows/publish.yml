name: http_request_utils Release

# Pushing a version tag (e.g. 0.4.0) publishes to pub.dev with automated
# publishing (GitHub OIDC, no stored credentials) and creates the GitHub
# release with the workflow's own token. pub.dev only accepts tag pushes
# whose tag matches the `{{version}}` pattern set in its admin page.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
      - name: Set up the pub.dev token (OIDC)
        uses: dart-lang/setup-dart@v1
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Check publish warnings
        run: dart pub publish --dry-run
      - name: Publish package
        run: dart pub publish --force

  release:
    name: Create Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file CHANGELOG_LATEST.md
